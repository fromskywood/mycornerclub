<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" style="overflow: visible;">
  <title>My Corner uppercase alphabet library - thin safe rendering</title>
  <desc>Uppercase A-Z vector alphabet inspired by the hand-drawn My Corner logo. Restored to the first, looser style for per-letter refinement.</desc>
  <defs>
    <style>
      .paper { fill: #fffdf9; }
      svg, symbol, use, g { overflow: visible; }
      .ink {
        fill: none;
        stroke: #080808;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: url(#handWobble);
      }
      .label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        letter-spacing: 0;
        fill: #777;
      }
      .guide {
        stroke: #ece7df;
        stroke-width: 2;
      }
    </style>
    <filter id="handWobble" x="-60%" y="-60%" width="220%" height="220%" filterUnits="objectBoundingBox">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.25"/>
    </filter>

    <symbol id="glyph-A" viewBox="0 0 120 160">
