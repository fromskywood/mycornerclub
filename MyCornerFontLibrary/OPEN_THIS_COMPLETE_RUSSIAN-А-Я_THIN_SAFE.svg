<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1640" viewBox="0 0 1900 1640" style="overflow: visible;">
  <title>My Corner Russian uppercase alphabet library - thin safe rendering</title>
  <desc>Russian uppercase А-Я vector alphabet inspired by the hand-drawn My Corner logo style.</desc>
  <defs>
    <style>
      .paper { fill: #fffdf9; }
      svg, symbol, use, g { overflow: visible; }
      .ink {
        fill: none;
        stroke: #080808;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: url(#handWobble);
      }
      .dot {
        fill: none;
        stroke: #080808;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: url(#handWobble);
      }
      .label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        letter-spacing: 0;
        fill: #777;
      }
      .guide {
        stroke: #ece7df;
        stroke-width: 2;
      }
    </style>
    <filter id="handWobble" x="-60%" y="-60%" width="220%" height="220%" filterUnits="objectBoundingBox">
